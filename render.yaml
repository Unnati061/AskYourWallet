services:
  - type: web
    name: askyourwallet-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: askyourwallet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_CATEGORIZATION_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_MAX_TOOL_ROUNDS
        value: "5"

databases:
  - name: askyourwallet-db
    region: singapore
    plan: free
    databaseName: askyourwallet
    user: askyourwallet
